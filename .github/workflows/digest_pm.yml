name: Evening Edition

# Fires around 19:00 Atlantic: 19:00 ADT = 22:00 UTC -> fire 21:25 UTC.
# Winter lands ~18:25 local. Sunday evening carries the "Nova Scotia radar"
# networking section automatically (render.py keys on the weekday).

on:
  schedule:
    - cron: "25 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  evening:
    runs-on: ubuntu-latest
    env:
      TZ: America/Halifax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Fetch, curate, render, send
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL:   ${{ vars.CLAUDE_MODEL }}
          ADZUNA_APP_ID:  ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
          RECIPIENT_NAME: ${{ secrets.RECIPIENT_NAME }}
        run: |
          python fetch.py
          python curate.py --edition evening
          python render.py

      - name: Commit state (history + edition archive)
        run: |
          git config user.name "job-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json editions/
          git diff --cached --quiet || git commit -m "Evening edition $(date +%F)"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push
