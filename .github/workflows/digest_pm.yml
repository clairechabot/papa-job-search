name: Evening Edition

# The single daily email + full web edition. Merges the morning scan's
# pending pool with a fresh evening scan, has Vern score everything, sends
# the short email cover, and rebuilds the GitHub Pages site (full edition,
# Archive, Grove). Fires ~19:00 Atlantic: 19:00 ADT = 22:00 UTC -> 21:25 UTC.

on:
  schedule:
    - cron: "25 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    env:
      TZ: America/Halifax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Fetch (merge pending pool), curate, render, publish, send
        env:
          CLAUDE_API_KEY:    ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL:      ${{ vars.CLAUDE_MODEL }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          ADZUNA_APP_ID:     ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY:    ${{ secrets.ADZUNA_APP_KEY }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          RECIPIENT_NAME:    ${{ secrets.RECIPIENT_NAME }}
          EDITION_URL:       ${{ vars.EDITION_URL }}
        run: |
          python fetch.py
          python curate.py --edition evening
          python webpage.py
          python render.py

      - name: Commit state (history, cleared pending, editions, docs/Pages)
        run: |
          git config user.name "vern-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json pending_jobs.json editions/ docs/
          git diff --cached --quiet || git commit -m "Evening edition $(date +%F)"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push
